apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "travel-site.fullname" . }}-config
  labels:
    {{- include "travel-site.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.config.nodeEnv | quote }}
  DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  REDIS_URL: {{ .Values.config.redisUrl | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CORS_ORIGIN: {{ .Values.config.corsOrigin | quote }}
  PORT: "4000"
