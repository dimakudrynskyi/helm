## Global settings
nameOverride: ""
fullnameOverride: ""

## Frontend deployment
frontend:
  replicaCount: 2
  image:
    repository: travel-site/frontend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

## Backend deployment
backend:
  replicaCount: 2
  image:
    repository: travel-site/backend
    tag: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 4000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  nodeSelector: {}
  tolerations: []
  affinity: {}

## Ingress
ingress:
  enabled: true
  className: nginx
  annotations: {}
  host: travel-site.example.com
  tls:
    enabled: false
    secretName: travel-site-tls

## ConfigMap - backend environment variables
config:
  nodeEnv: production
  databaseUrl: "postgresql://travel_user@db-host:5432/travel_site"
  redisUrl: "redis://redis-host:6379"
  logLevel: info
  corsOrigin: "https://travel-site.example.com"

## Secret - sensitive values (base64 encoded at deploy time)
secret:
  dbPassword: "CHANGE_ME"
  apiKey: "CHANGE_ME"

## ServiceAccount
serviceAccount:
  create: true
  annotations: {}
  name: ""
  ## IRSA role ARN for EKS
  ## Example: arn:aws:iam::123456789012:role/travel-site-role
  irsaRoleArn: ""

## Image pull secrets
imagePullSecrets: []
